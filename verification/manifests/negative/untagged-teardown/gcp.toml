# NEGATIVE / untagged-teardown / gcp -- deprovision a resource whose identity tag is gone.
#
# An absent identity marker must read as 'not ours', never as consent. This is
# the pre-identity-tag resource, the half-finished import, and the operator's
# own database that happens to answer to our derived name -- all at once.
# Refusing costs an operator one adoption step; not refusing costs a customer
# their data.
#
# Hand-authored: each negative cell encodes a different refusal, and a
# generated table would hide the only part worth reading.
name = "cert2026q3-neg-untagged-gcp"

[campaign]
slug = "cert2026q3"
cell = "negative/untagged-teardown/gcp"
cloud = "gcp"
fixture = "calliopeai/astrolift-sample-api"
purpose = "safety: fail-closed ownership on teardown"

[campaign.tags]
campaign = "cert2026q3"

[campaign.negative]
case = "untagged-teardown"
expect = "refused"
precondition = "Provision this manifest, then strip the identity tag out of band: gcloud sql instances patch <instance> --clear-labels. This is the one place in the campaign that mutates a resource outside the platform, and creating that state is the whole point of the cell."
assert = "deprovision returns a refusal that names the missing identity tag, and the server still exists when the cell finishes"
assert_not = "the resource is not deleted, not stopped, and not renamed"
remedy = "explicit authorized adoption re-stamps the identity and is the supported way out; the campaign removes the leftover by hand and records it, because an unowned resource is exactly what the orphan scanner cannot see"
known_gap = "gcp/managed/postgres_cloudsql.py deletes by instance id with no identity read; same expected result as AWS."

[[workloads]]
name = "web"
kind = "deployment"
is_public = true
replicas = 1
cpu_request = "100m"
cpu_limit = "500m"
memory_request = "128Mi"
memory_limit = "256Mi"

  [[workloads.containers]]
  name = "app"
  is_primary = true
  image_ref = "docker.io/calliopeai/astrolift-sample-api:main-df5ffa3"
  port = 8080
  command = ["python", "entrypoint.py", "web"]

    [workloads.containers.env]
    LOG_LEVEL = "info"
    PORT = "8080"

    [workloads.containers.healthcheck]
    kind = "http"
    value = "/health"
    port = 8080

[[managed_services]]
kind = "postgres"
name = "records"
variant = "cloudsql"
