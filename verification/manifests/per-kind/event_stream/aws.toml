# PER-KIND / event_stream / aws -- variant msk_serverless.
#
# One managed service, one cloud, the full lifecycle cycle. The fixture only
# opens live clients for postgres, redis, queue and object_store; every other
# kind is verified by binding presence in /debug plus a clean VERIFY-CLEAN.
# Binding envelope to assert in /debug: EVENT_STREAM_BROKERS, EVENT_STREAM_USERNAME, EVENT_STREAM_PASSWORD, EVENT_STREAM_TLS, EVENT_STREAM_AUTH_MECHANISM, EVENT_STREAM_CLIENT_CERT, EVENT_STREAM_CLIENT_KEY, EVENT_STREAM_CA_CERT, AWS_REGION, MSK_CLUSTER_ARN, MSK_CLUSTER_NAME, MSK_BOOTSTRAP_BROKERS, MSK_AUTH_MECHANISM.
#
# Generated from providers/_cert/collection.py -- do not hand-edit.
name = "cert2026q3-event-stream-aws"

[campaign]
slug = "cert2026q3"
cell = "per-kind/event_stream/aws"
cloud = "aws"
fixture = "calliopeai/astrolift-sample-api"
purpose = "coverage: event_stream via msk_serverless"

# Operator tags the harness threads into ProvisionSpec.tags. The app name
# carries the campaign slug as well, because no operator tag reaches an IAM
# principal and two GCP drivers drop spec.tags outright -- see _cert/campaign.py.
[campaign.tags]
campaign = "cert2026q3"

[[workloads]]
name = "web"
kind = "deployment"
is_public = true
replicas = 1
cpu_request = "100m"
cpu_limit = "500m"
memory_request = "128Mi"
memory_limit = "256Mi"

  [[workloads.containers]]
  name = "app"
  is_primary = true
  image_ref = "docker.io/calliopeai/astrolift-sample-api:main-df5ffa3"
  port = 8080
  command = ["python", "entrypoint.py", "web"]

    [workloads.containers.env]
    LOG_LEVEL = "info"
    PORT = "8080"

    [workloads.containers.healthcheck]
    kind = "http"
    value = "/health"
    port = 8080

[[managed_services]]
kind = "event_stream"
name = "event-stream"
variant = "msk_serverless"
