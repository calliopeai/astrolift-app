# PER-KIND / search / gcp -- variant opensearch_operator (in-cluster).
#
# One managed service, one cloud, the full lifecycle cycle. The fixture only
# opens live clients for postgres, redis, queue and object_store; every other
# kind is verified by binding presence in /debug plus a clean VERIFY-CLEAN.
# Binding envelope to assert in /debug: SEARCH_ENDPOINT, SEARCH_USER, SEARCH_PASSWORD, SEARCH_INDEX_PREFIX, SEARCH_TLS_VERIFY.
#
# gcp sells no managed search, so this cell books the in-cluster
# variant a portable app would actually get there. It runs on the gcp
# cluster itself, resolved through the k8s_native fallback in
# astrolift_drivers/managed_resolution.py -- which is the thing this cell
# certifies as much as the driver is.
#
# Generated from providers/_cert/collection.py -- do not hand-edit.
name = "cert2026q3-search-gcp"

[campaign]
slug = "cert2026q3"
cell = "per-kind/search/gcp"
cloud = "gcp"
fixture = "calliopeai/astrolift-sample-api"
purpose = "coverage: search via opensearch_operator"

# Operator tags the harness threads into ProvisionSpec.tags. The app name
# carries the campaign slug as well, because no operator tag reaches an IAM
# principal and two GCP drivers drop spec.tags outright -- see _cert/campaign.py.
[campaign.tags]
campaign = "cert2026q3"

[[workloads]]
name = "web"
kind = "deployment"
is_public = true
replicas = 1
cpu_request = "100m"
cpu_limit = "500m"
memory_request = "128Mi"
memory_limit = "256Mi"

  [[workloads.containers]]
  name = "app"
  is_primary = true
  image_ref = "docker.io/calliopeai/astrolift-sample-api:main-df5ffa3"
  port = 8080
  command = ["python", "entrypoint.py", "web"]

    [workloads.containers.env]
    LOG_LEVEL = "info"
    PORT = "8080"

    [workloads.containers.healthcheck]
    kind = "http"
    value = "/health"
    port = 8080

[[managed_services]]
kind = "search"
name = "search"
variant = "opensearch_operator"
