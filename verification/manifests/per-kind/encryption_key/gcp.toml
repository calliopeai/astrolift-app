# PER-KIND / encryption_key / gcp -- variant cloud_kms.
#
# One managed service, one cloud, the full lifecycle cycle. The fixture only
# opens live clients for postgres, redis, queue and object_store; every other
# kind is verified by binding presence in /debug plus a clean VERIFY-CLEAN.
# Binding envelope to assert in /debug: ENCRYPTION_KEY_ID, ENCRYPTION_KEY_ARN, ENCRYPTION_KEY_ALIAS, ENCRYPTION_KEY_SPEC, ENCRYPTION_KEY_USAGE, ENCRYPTION_KEY_MULTI_REGION, GCP_KMS_KEY_NAME, GCP_KMS_KEY_RING, GCP_KMS_LOCATION, GCP_KMS_PROTECTION_LEVEL, GCP_PROJECT_ID.
#
# Generated from providers/_cert/collection.py -- do not hand-edit.
name = "cert2026q3-encryption-key-gcp"

[campaign]
slug = "cert2026q3"
cell = "per-kind/encryption_key/gcp"
cloud = "gcp"
fixture = "calliopeai/astrolift-sample-api"
purpose = "coverage: encryption_key via cloud_kms"

# Operator tags the harness threads into ProvisionSpec.tags. The app name
# carries the campaign slug as well, because no operator tag reaches an IAM
# principal and two GCP drivers drop spec.tags outright -- see _cert/campaign.py.
[campaign.tags]
campaign = "cert2026q3"

[[workloads]]
name = "web"
kind = "deployment"
is_public = true
replicas = 1
cpu_request = "100m"
cpu_limit = "500m"
memory_request = "128Mi"
memory_limit = "256Mi"

  [[workloads.containers]]
  name = "app"
  is_primary = true
  image_ref = "docker.io/calliopeai/astrolift-sample-api:main-df5ffa3"
  port = 8080
  command = ["python", "entrypoint.py", "web"]

    [workloads.containers.env]
    LOG_LEVEL = "info"
    PORT = "8080"

    [workloads.containers.healthcheck]
    kind = "http"
    value = "/health"
    port = 8080

[[managed_services]]
kind = "encryption_key"
name = "encryption-key"
variant = "cloud_kms"
