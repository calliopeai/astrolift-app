# PER-KIND / workflow_engine / azure -- variant argo_workflows (in-cluster).
#
# One managed service, one cloud, the full lifecycle cycle. The fixture only
# opens live clients for postgres, redis, queue and object_store; every other
# kind is verified by binding presence in /debug plus a clean VERIFY-CLEAN.
# Binding envelope to assert in /debug: WORKFLOW_ENGINE_ID, WORKFLOW_ENGINE_ARN, WORKFLOW_ENGINE_REGION, WORKFLOW_ENGINE_TYPE, ARGO_WORKFLOW_TEMPLATE, ARGO_WORKFLOW_NAMESPACE, ARGO_SERVER_URL, ARGO_EVENT_ENDPOINT.
#
# azure sells no managed workflow_engine, so this cell books the in-cluster
# variant a portable app would actually get there. It runs on the azure
# cluster itself, resolved through the k8s_native fallback in
# astrolift_drivers/managed_resolution.py -- which is the thing this cell
# certifies as much as the driver is.
#
# Generated from providers/_cert/collection.py -- do not hand-edit.
name = "cert2026q3-workflow-engine-azure"

[campaign]
slug = "cert2026q3"
cell = "per-kind/workflow_engine/azure"
cloud = "azure"
fixture = "calliopeai/astrolift-sample-api"
purpose = "coverage: workflow_engine via argo_workflows"

# Operator tags the harness threads into ProvisionSpec.tags. The app name
# carries the campaign slug as well, because no operator tag reaches an IAM
# principal and two GCP drivers drop spec.tags outright -- see _cert/campaign.py.
[campaign.tags]
campaign = "cert2026q3"

[[workloads]]
name = "web"
kind = "deployment"
is_public = true
replicas = 1
cpu_request = "100m"
cpu_limit = "500m"
memory_request = "128Mi"
memory_limit = "256Mi"

  [[workloads.containers]]
  name = "app"
  is_primary = true
  image_ref = "docker.io/calliopeai/astrolift-sample-api:main-df5ffa3"
  port = 8080
  command = ["python", "entrypoint.py", "web"]

    [workloads.containers.env]
    LOG_LEVEL = "info"
    PORT = "8080"

    [workloads.containers.healthcheck]
    kind = "http"
    value = "/health"
    port = 8080

[[managed_services]]
kind = "workflow_engine"
name = "workflow-engine"
variant = "argo_workflows"
