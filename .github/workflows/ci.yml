name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install ruff
        run: pip install "ruff>=0.6,<0.7"
      - name: Format check
        run: ruff format --check .
      - name: Lint
        run: ruff check .

  test:
    name: test (real postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dbadmin
          POSTGRES_PASSWORD: Password123
          POSTGRES_DB: astrolift_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dbadmin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ci-not-a-secret
      POSTGRES_ENGINE: django.db.backends.postgresql
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: astrolift_test
      POSTGRES_USER: dbadmin
      POSTGRES_PASSWORD: Password123
      DJANGO_CACHE_URL: redis://127.0.0.1:6379/1
      TEMPORAL_ADDRESS: 127.0.0.1:7233
      TEMPORAL_NAMESPACE: default
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Temporal CLI
        # Tests against real Temporal (test env) per backend/CLAUDE.md.
        # dev-server uses SQLite + in-process — boots in seconds, no
        # external state, perfect for CI.
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          echo "$HOME/.temporalio/bin" >> "$GITHUB_PATH"
      - name: Start Temporal dev server
        run: |
          "$HOME/.temporalio/bin/temporal" server start-dev \
            --headless --port 7233 --namespace default \
            --log-level warn > /tmp/temporal.log 2>&1 &
          for _ in $(seq 1 30); do
            if "$HOME/.temporalio/bin/temporal" \
              --address 127.0.0.1:7233 operator namespace describe default \
              >/dev/null 2>&1; then
              echo "Temporal ready"
              exit 0
            fi
            sleep 1
          done
          echo "Temporal did not become ready in 30s"
          cat /tmp/temporal.log
          exit 1
      - name: Install pipenv
        # Pinned to the version that generated Pipfile.lock — pipenv
        # ships breaking changes to its Pipfile-hash algorithm across
        # majors, so an unpinned `pip install pipenv` here drifts the
        # expected vs. recorded hash and breaks `--deploy`.
        run: pip install "pipenv==2026.6.1"
      - name: Install dependencies
        run: pipenv install --dev --deploy
      - name: Install vendored provider plugins
        # The lifecycle observability surface dispatches through
        # astrolift-providers (#299) — install the vendored snapshot
        # into the same pipenv venv so `_sdk` + `k8s_native` + the
        # cloud plugins resolve at import time. The Docker image
        # does this in its build step; CI mirrors it.
        run: pipenv run pip install ./vendor/astrolift-providers[aws,gcp,azure,k8s]
      - name: Run migrations
        run: pipenv run python manage.py migrate --noinput
      - name: Run tests
        run: pipenv run pytest -x

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pipenv
        # Pinned to the version that generated Pipfile.lock — pipenv
        # ships breaking changes to its Pipfile-hash algorithm across
        # majors, so an unpinned `pip install pipenv` here drifts the
        # expected vs. recorded hash and breaks `--deploy`.
        run: pip install "pipenv==2026.6.1"
      - name: Install dependencies
        run: pipenv install --dev --deploy
      - name: Install vendored provider plugins
        # Mirrors the test job — mypy follows imports into
        # core.cluster_observability which references _sdk.cluster
        # from the vendored astrolift-providers package.
        run: pipenv run pip install ./vendor/astrolift-providers[aws,gcp,azure,k8s]
      - name: Run mypy on the platform core
        run: pipenv run mypy core config || true

  frontend-lint:
    name: lint (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
