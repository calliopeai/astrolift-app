name: nightly

# The full test matrix once a day (#2413): every shard and frontend job, with
# the `slow` and `rarely` test tiers that pull requests and pushes to main
# skip. `manual` tests never run in CI. Dispatch it to run the same set on
# demand; `ci` on a branch with `tier: nightly` does the same for a branch.

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

# What ci.yml's jobs request; a called workflow cannot exceed its caller.
permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  ci:
    name: ci (nightly tier)
    uses: ./.github/workflows/ci.yml
    with:
      tier: nightly
