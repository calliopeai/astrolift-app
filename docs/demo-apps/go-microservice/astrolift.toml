# Demo: Go microservice
#
# Topology tested:
#   - Deploy from a pre-built image (no Dockerfile build)
#   - Tight resource limits (Go binaries are small)
#   - Custom domain bound after registration (Apps > Domains)

name = "demo-go-svc"

[[workloads]]
name      = "svc"
kind      = "deployment"
is_public = true
replicas  = 3
# Go binaries are lean. Keep limits tight for realistic resource testing.
cpu_request    = "50m"
cpu_limit      = "200m"
memory_request = "32Mi"
memory_limit   = "64Mi"

  [[workloads.containers]]
  name       = "svc"
  is_primary = true
  port       = 8080
  # Instead of building from source, Astrolift pulls this image directly;
  # register the app with --build-mode none. The tag is pinned; update it
  # to roll forward.
  image_ref  = "ghcr.io/calliopeai/demo-go-svc:latest"
  healthcheck = { kind = "http", value = "/readyz" }

[env]
GO_ENV     = "production"
LOG_FORMAT = "json"

# A custom hostname is added on the app's Domains page after registration;
# Astrolift issues the certificate and, with external-dns on the cluster,
# creates the DNS record.
#
# Secrets are created on the app, not in the manifest:
#   astro app secrets create JWT_SIGNING_KEY --stdin
#   astro app secrets create DATABASE_URL --stdin
