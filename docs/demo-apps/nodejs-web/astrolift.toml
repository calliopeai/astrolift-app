# Demo: Node.js web application
#
# Topology tested:
#   - Single HTTP workload
#   - Build from source (Dockerfile at repo root)
#   - Auto-managed TLS via cert-manager
#   - App-wide environment variables plus app secrets
#   - Basic health probe

name = "demo-nodejs-web"

[[workloads]]
name       = "web"
kind       = "deployment"
# is_public = true tells Astrolift to create the Ingress. The hostname
# is <slug>.<cluster-base-domain>; cert-manager issues the certificate.
is_public  = true
replicas   = 2
cpu_request    = "100m"
cpu_limit      = "500m"
memory_request = "128Mi"
memory_limit   = "256Mi"

  [[workloads.containers]]
  name       = "web"
  is_primary = true
  port       = 3000
  # Astrolift builds from the Dockerfile at the repo root (platform_build)
  # or deploys the image CI pushed (ci_pushed); pick with --build-mode at
  # registration.
  dockerfile_path = "Dockerfile"
  build_context   = "."
  # Astrolift creates a Kubernetes readinessProbe and livenessProbe from
  # this. The path must return HTTP 2xx when the app is ready.
  healthcheck = { kind = "http", value = "/health" }

[env]
# Non-secret environment variables, injected as-is into every workload.
NODE_ENV  = "production"
LOG_LEVEL = "info"
PORT      = "3000"

# Secrets never live in the manifest. Create them on the registered app;
# each key becomes an environment variable in the running container:
#   astro app secrets create DATABASE_URL --stdin
#   astro app secrets create SESSION_SECRET --stdin
