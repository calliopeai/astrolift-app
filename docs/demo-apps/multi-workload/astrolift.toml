# Demo: Multi-workload application (web server + background worker)
#
# Topology tested:
#   - Multiple workloads from the same app registration
#   - Shared secrets across workloads
#   - Managed Redis bound to both workloads
#   - Managed Postgres bound to the web workload only
#   - Worker scales independently of the web server
#   - Web server has ingress; worker has none

name = "demo-multi-workload"

# Each [[workloads]] entry gets its own Deployment. They share the same
# image, app secrets and managed service bindings.

[[workloads]]
name      = "web"
kind      = "deployment"
is_public = true
replicas  = 2
cpu_request    = "200m"
cpu_limit      = "1000m"
memory_request = "256Mi"
memory_limit   = "512Mi"

  [[workloads.containers]]
  name       = "web"
  is_primary = true
  port       = 8000
  dockerfile_path = "Dockerfile"
  build_context   = "."
  command    = ["gunicorn", "app:app", "--bind", "0.0.0.0:8000"]
  healthcheck = { kind = "http", value = "/health" }

[[workloads]]
name     = "worker"
kind     = "deployment"
replicas = 1
cpu_request    = "100m"
cpu_limit      = "500m"
memory_request = "128Mi"
memory_limit   = "256Mi"
# CPU-based autoscaling for the worker pool (requires metrics-server).
hpa_min = 1
hpa_max = 10
hpa_target_cpu_pct = 80

  [[workloads.containers]]
  name       = "worker"
  is_primary = true
  # No port and no healthcheck: the worker only consumes from the queue.
  command    = ["celery", "-A", "app.celery", "worker", "--loglevel=info"]

# Managed services bind to every workload unless bind_workloads narrows it.
# Bindings inject DATABASE_URL (postgres) and REDIS_URL (redis).

[[managed_services]]
kind = "postgres"
name = "demo-multi-db"
size = "small"
version = "15"
bind_workloads = ["web"]

[[managed_services]]
kind = "redis"
name = "demo-multi-redis"
size = "small"
version = "7"

[env]
APP_ENV       = "production"
LOG_LEVEL     = "info"
CELERY_BROKER = "redis"    # resolved to REDIS_URL at runtime

# Secrets are created on the app and reach every workload:
#   astro app secrets create SECRET_KEY --stdin
#   astro app secrets create STORAGE_BUCKET --stdin
