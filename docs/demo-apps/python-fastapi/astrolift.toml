# Demo: Python FastAPI service
#
# Topology tested:
#   - Build from source with a multi-stage Dockerfile
#   - Managed Postgres provisioned and bound automatically
#   - Health probe on the FastAPI /health endpoint
#   - Autoscaling on CPU utilization (requires metrics-server)

name = "demo-python-api"

[[workloads]]
name      = "api"
kind      = "deployment"
is_public = true
replicas  = 1
cpu_request    = "200m"
cpu_limit      = "1000m"
memory_request = "256Mi"
memory_limit   = "512Mi"
# Horizontal pod autoscaling. Requires metrics-server on the cluster.
# Scale up when average CPU across all pods exceeds 70%.
hpa_min = 1
hpa_max = 5
hpa_target_cpu_pct = 70

  [[workloads.containers]]
  name       = "api"
  is_primary = true
  port       = 8000
  dockerfile_path = "Dockerfile"
  build_context   = "."
  healthcheck = { kind = "http", value = "/health" }

# Astrolift provisions a Postgres instance via the cluster's cloud
# provider (RDS on AWS, Cloud SQL on GCP, Azure Database for Postgres
# on Azure, or in-cluster via the Postgres operator on k8s_native).
# The binding injects DATABASE_URL into the bound workloads.
[[managed_services]]
kind = "postgres"
name = "demo-python-api-db"
size = "small"
version = "15"

[env]
PYTHON_ENV = "production"
LOG_LEVEL  = "info"
WORKERS    = "2"

# Secrets are created on the app, not in the manifest:
#   astro app secrets create SECRET_KEY --stdin
#   astro app secrets create THIRD_PARTY_API_KEY --stdin
