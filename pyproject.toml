[project]
name = "astrolift-providers"
version = "0.1.0"
description = "Astrolift provider plugin SDK and per-cloud driver implementations"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["_sdk", "aws", "gcp", "azure", "k8s_native"]

[project.entry-points."astrolift.providers"]
aws = "aws.plugin:PLUGIN"
gcp = "gcp.plugin:PLUGIN"
azure = "azure.plugin:PLUGIN"
k8s_native = "k8s_native.plugin:PLUGIN"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["_sdk", "aws", "gcp", "azure", "k8s_native"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "google.*", "azure.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
