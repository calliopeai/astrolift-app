[pytest]
DJANGO_SETTINGS_MODULE = config.settings
; -p no:snapshottest blocks snapshottest's pytest entry point from
; loading. The package may still be installed in older images but is
; no longer part of the dependency set; this keeps test collection
; clean until the image rebuilds.
addopts = --strict-markers -p no:warnings -p no:snapshottest

python_files = tests.py test_*.py *_tests.py

markers =
  functional: Run functional tests for graphql operations

log_cli = True
