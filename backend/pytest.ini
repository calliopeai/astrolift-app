[pytest]
DJANGO_SETTINGS_MODULE = config.test_settings
; -p no:snapshottest blocks snapshottest's pytest entry point from
; loading. The package may still be installed in older images but is
; no longer part of the dependency set; this keeps test collection
; clean until the image rebuilds.
addopts = --strict-markers -p no:warnings -p no:snapshottest
; pytest 9 ignores --strict-markers in addopts: an unregistered marker
; collected without complaint. The ini option is what makes it strict
; (core/tests/test_test_tiers_2413.py holds it there).
strict_markers = true

python_files = tests.py test_*.py *_tests.py

; pytest-asyncio runs every `async def` test under its own loop without
; requiring a per-test `@pytest.mark.asyncio` decorator. Matches how
; the pubsub / exec-ws / temporal worker tests are written.
asyncio_mode = auto

; Test tiers (#2413). CI selects with -m: pull requests run
; "not slow and not rarely and not manual", pushes to main
; "not rarely and not manual", the nightly workflow "not manual".
; A plain local `pytest` runs everything except manual.
markers =
  functional: Run functional tests for graphql operations
  integration: needs an operator-provided cluster; its fixture skips without one
  timeout(seconds, method): pytest-timeout's marker; inert unless that plugin is installed
  slow: measured at 15 s or more on CI; skipped on pull requests, run on pushes to main and nightly
  rarely: heavy migration roundtrip and backfill edge cases; run nightly and on dispatch only
  manual: never run in CI; runs only when -m names it (pytest -m manual)

log_cli = True
