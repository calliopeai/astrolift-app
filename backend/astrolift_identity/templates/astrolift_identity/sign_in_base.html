{% load i18n %}<!DOCTYPE html>
{# The Astrolift sign-in frame (#2285): the app's dark tokens, the mark, phone width. No external requests. #}
<html lang="{{ LANGUAGE_CODE|default:'en' }}">
<head>
  <meta charset="utf-8">
  <title>{% block title %}{% endblock %} · Astrolift</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <style>
    :root {
      --ground: #000000; --panel: #0a0a0a; --raised: #141414; --brand: #04231a;
      --fg: #f0f2f1; --muted: #848b88; --line: rgba(255, 255, 255, 0.1);
      --action: #2f9e52; --action-ink: #04241b; --ring: rgba(47, 158, 82, 0.45);
      --ok: #8fd82a; --warn: #f0c34e; --err: #ff6b6b;
      --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --head: "DM Sans", var(--sans);
      --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--ground); color: var(--fg);
           font: 15px/1.5 var(--sans); display: flex; flex-direction: column; }
    .brand { display: flex; align-items: center; gap: 0.6rem; padding: 0.9rem 1.25rem;
             background: var(--brand); border-bottom: 1px solid var(--line); }
    .brand span { font: 600 0.95rem/1 var(--head); letter-spacing: -0.01em; }
    main { flex: 1; display: flex; align-items: flex-start; justify-content: center; padding: 3rem 1rem; }
    .card { width: 100%; max-width: 28rem; background: var(--panel); border: 1px solid var(--line);
            border-radius: 2px; padding: 1.75rem; }
    .card.center { text-align: center; }
    h1 { font: 600 1.2rem/1.3 var(--head); margin: 0 0 0.5rem; }
    p { color: var(--muted); margin: 0 0 1rem; }
    p.lead { margin-bottom: 1.5rem; }
    .state { display: inline-flex; align-items: center; justify-content: center; width: 2.5rem;
             height: 2.5rem; border-radius: 50%; margin-bottom: 0.75rem; font-size: 1.2rem;
             border: 1px solid currentColor; }
    .state.ok { color: var(--ok); box-shadow: 0 0 14px rgba(143, 216, 42, 0.25); }
    .state.warn { color: var(--warn); }
    .state.err { color: var(--err); }
    .meta { background: var(--raised); border: 1px solid var(--line); border-radius: 2px;
            padding: 0.9rem 1rem; font-size: 0.875rem; margin: 0 0 1.5rem; }
    .meta dt { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; }
    .meta dd { margin: 0.15rem 0 0.6rem; font-family: var(--mono); word-break: break-word; }
    .meta dd:last-child { margin-bottom: 0; }
    .client { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); margin: 0; }
    .scope-list { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .scope { border: 1px solid var(--line); border-radius: 999px; padding: 0.1rem 0.55rem;
             font: 0.75rem var(--mono); color: var(--fg); background: rgba(255, 255, 255, 0.04); }
    .actions { display: flex; gap: 0.5rem; }
    button { flex: 1; padding: 0.7rem 1rem; border-radius: 2px; font: 600 0.875rem var(--sans); cursor: pointer; }
    button.primary { background: var(--action); color: var(--action-ink); border: 1px solid var(--action); }
    button.primary:hover { filter: brightness(1.08); }
    button.secondary { background: transparent; color: var(--fg); border: 1px solid var(--line); }
    button.secondary:hover { background: rgba(255, 255, 255, 0.05); }
    button:focus-visible, select:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--ring); }
    .error { background: rgba(255, 107, 107, 0.1); border: 1px solid rgba(255, 107, 107, 0.35);
             color: #ff8a8a; padding: 0.7rem 0.9rem; border-radius: 2px; margin-bottom: 1rem; font-size: 0.875rem; }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.35rem; }
    select { width: 100%; padding: 0.55rem 0.7rem; margin-bottom: 1.25rem; background: rgba(255, 255, 255, 0.04);
             color: var(--fg); border: 1px solid var(--line); border-radius: 2px; font: inherit; }
    @media (max-width: 420px) { main { padding: 1.5rem 0.75rem; } .card { padding: 1.25rem; } .actions { flex-direction: column; } }
  </style>
</head>
<body>
  <header class="brand">
    <svg width="22" height="22" viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <path d="M16 3 L26 27 L16 22 L6 27 Z" stroke="#2F9E52" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="16" cy="14" r="2.5" fill="#2F9E52"/>
    </svg>
    <span>Astrolift</span>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
