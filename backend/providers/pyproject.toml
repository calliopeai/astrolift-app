[project]
name = "astrolift-providers"
version = "0.2.0"
description = "Astrolift provider plugin SDK and per-cloud driver implementations"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
# Core SDK has zero runtime deps. Per-cloud plugin extras are optional
# so installs that only need k8s_native don't pull in boto3 + every
# cloud SDK.
dependencies = []

[project.optional-dependencies]
aws = [
    "boto3>=1.34",
    "botocore>=1.34",
    # Pinned: 36.0.0 introduced a regression where ApiClient drops the
    # Authorization header for inline Bearer tokens against EKS (reproducible
    # with raw urllib + Bearer = 200 but ApiClient + same token = 401).
    # 35.0.0 is what monorail-class AWS Django apps ship working in prod.
    "kubernetes>=29.0,<36",
    "PyYAML>=6.0",
]
gcp = [
    "google-cloud-container>=2.40",
    "google-cloud-secret-manager>=2.20",
    "google-cloud-dns>=0.34",
    # Pinned: 36.0.0 introduced a regression where ApiClient drops the
    # Authorization header for inline Bearer tokens against EKS (reproducible
    # with raw urllib + Bearer = 200 but ApiClient + same token = 401).
    # 35.0.0 is what monorail-class AWS Django apps ship working in prod.
    "kubernetes>=29.0,<36",
    "PyYAML>=6.0",
]
azure = [
    "azure-identity>=1.16",
    "azure-mgmt-containerservice>=30.0",
    "azure-mgmt-dns>=8.1",
    "azure-keyvault-secrets>=4.7",
    # CI push role on ACR provisions a User-Assigned Managed Identity +
    # AcrPush role assignment + GitHub OIDC Federated Identity Credential.
    "azure-mgmt-msi>=7.0",
    "azure-mgmt-authorization>=4.0",
    # Pinned: 36.0.0 introduced a regression where ApiClient drops the
    # Authorization header for inline Bearer tokens against EKS (reproducible
    # with raw urllib + Bearer = 200 but ApiClient + same token = 401).
    # 35.0.0 is what monorail-class AWS Django apps ship working in prod.
    "kubernetes>=29.0,<36",
    "PyYAML>=6.0",
]
k8s = [
    # Pinned: 36.0.0 introduced a regression where ApiClient drops the
    # Authorization header for inline Bearer tokens against EKS (reproducible
    # with raw urllib + Bearer = 200 but ApiClient + same token = 401).
    # 35.0.0 is what monorail-class AWS Django apps ship working in prod.
    "kubernetes>=29.0,<36",
    "PyYAML>=6.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "moto[s3,iam,sts,ec2,eks,route53,acm,ecr,secretsmanager,ssm,sqs,sns,dynamodb,elasticache,rds,efs]>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["_sdk", "aws", "gcp", "azure", "k8s_native"]

[project.entry-points."astrolift.providers"]
aws = "aws.plugin:PLUGIN"
gcp = "gcp.plugin:PLUGIN"
azure = "azure.plugin:PLUGIN"
k8s_native = "k8s_native.plugin:PLUGIN"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["_sdk", "aws", "gcp", "azure", "k8s_native"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "google.*", "azure.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
